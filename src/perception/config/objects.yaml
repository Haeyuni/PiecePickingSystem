# 물체 속성 마스터의 초기값(seed). 런타임에는 DB object_attributes 테이블로 옮겨져 갱신된다.
# 참조: 인터페이스_정의서.md 5.1절 / 단위 규칙은 1.1절 (길이 mm, 힘 N)
# TODO: approach_speed의 단위가 미확정이다 — mm/s인지 최대속도 대비 비율(0~1)인지 정해야 한다.
#       mm 통일 결정(1.1절) 이후에도 이 값만 해석이 열려 있으므로 control 착수 전 확정할 것.

profiles:
  normal:      { max_grip_force_n: 20.0, approach_speed: 0.25, contact_threshold_n: 8.0 }
  fragile:     { max_grip_force_n: 5.0,  approach_speed: 0.08, contact_threshold_n: 3.0 }
  deformable:  { max_grip_force_n: 12.0, approach_speed: 0.20, contact_threshold_n: 5.0 }

# 검출 모델의 클래스명 → 이 파일의 class_name 매핑 (개발계획.md D-7).
#
# 2026-09-05 클래스 전면 교체: 이전 모델(suncream/tape/nail_product 등 6클래스)이 폐기되고
# 신규 7클래스 모델로 바뀌었다. 이전 모델 라벨과의 매핑은 이 모델에서 더 이상 나오지 않으므로
# 함께 제거한다 — 남겨두면 다음 사람이 지금도 나오는 라벨인 줄 헷갈린다. perception이 모델
# 출력을 DetectedObject.class_name으로 옮길 때 **반드시 이 표를 지난다** — 안 지나면 전부
# 미확인 신규품목으로 떨어지고 FR-05b에 따라 fragile 프로파일이 강제된다(조용히 느려질 뿐
# 오류로는 보이지 않는다). DB 시드(seed.py)와 평가셋(eval/test_set.jsonl)은 여전히 옛
# 3클래스를 참조하므로 별도로 갱신해야 한다(아직 미반영, 개발계획.md에 등록).
model_labels:
  ringring_gel_nail_twinkle_silver: gel_nail
  ecla_moist_wet_wipes: wet_wipes
  editb_bare_bunny_tone_filter_sunscreen: sunscreen
  jjanggu_rabbit_doll: doll
  pigeon_blue_bianca_spray: fabric_spray
  dentimate_new_total_care_toothpaste: toothpaste
  navy_folding_umbrella: umbrella

# 클래스 목록 갱신 (2026-09-05, 모델 전면 교체). 아래 속성은 실측이 아닌 초기 추정값이다 —
# FR-05b에 따라 실제 승인 이력이 쌓이는 대로 user_confirmed로 덮어써야 한다.
objects:
  gel_nail:
    name_ko: 젤네일
    mass_g: 15
    fragile: true       # 유리병 — 강하게 쥐면 깨질 수 있다
    deformable: false
    transparent: false
    profile: fragile
  wet_wipes:
    name_ko: 물티슈
    mass_g: 300
    fragile: false
    deformable: true    # 비닐 포장 — 쥐는 힘에 눌린다
    transparent: false
    profile: deformable
  sunscreen:
    name_ko: 썬크림
    mass_g: 50
    fragile: false
    deformable: false
    transparent: false
    profile: normal
  doll:
    name_ko: 인형
    mass_g: 120
    fragile: false
    deformable: true    # 봉제 인형 — 눌려도 손상 아님
    transparent: false
    profile: deformable
  fabric_spray:
    name_ko: 섬유탈취제
    mass_g: 350
    fragile: false
    deformable: false
    transparent: false
    profile: normal
  toothpaste:
    name_ko: 치약
    mass_g: 100
    fragile: false
    deformable: true    # 튜브 — 쥐는 힘에 눌린다
    transparent: false
    profile: deformable
  umbrella:
    name_ko: 우산
    mass_g: 300
    fragile: false
    deformable: false
    transparent: false
    profile: normal

fallback:            # DB에 없는 신규 클래스에 적용하는 보수적 기본값 (FR-05)
  mass_g: null
  fragile: true
  deformable: false
  transparent: false
  profile: fragile
