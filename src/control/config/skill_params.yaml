# profile별 힘/속도 파라미터 + 시각검증 상대이동값
# 미확정 — perception/config/objects.yaml의 profiles와 일치시켜 관리 (중복 정의 주의)
# 단위: 길이 mm, 힘 N (인터페이스_정의서.md 1.1절). approach_speed 단위는 objects.yaml의 TODO 참조
# TODO: 값 확정 (시스템명세서 미확정 항목 참조)
#
# pick/place 실물 1단계(2026-09-04, 위치제어만)는 이 중 max_grip_force_n만 쓴다
# (그리퍼의 힘 제한 close, dsr_motion.move_gripper 참조) — approach_speed·
# contact_threshold_n은 compliance.py(순응제어, 아직 미구현)가 붙는 2단계의 몫이다.

profiles:
  normal:      { max_grip_force_n: 20.0, approach_speed: 0.25, contact_threshold_n: 8.0 }
  fragile:     { max_grip_force_n: 5.0,  approach_speed: 0.08, contact_threshold_n: 3.0 }
  deformable:  { max_grip_force_n: 12.0, approach_speed: 0.20, contact_threshold_n: 5.0 }

motion:
  # pick/place 실물 1단계에 쓰는 값. dsr_msgs2 movel_h2r이 요구하는 단위 그대로
  # (mm, mm/s, mm/s^2, deg/s, deg/s^2) 둔다 — home과 같은 이유(units.py를 지나지 않음).
  approach_height_mm: 80.0       # grasp_pose/bin_pose 바로 위에서 한 번 멈췄다 내려간다
  linear_vel_mm_s: 30.0
  linear_acc_mm_s2: 30.0
  rot_vel_deg_s: 20.0
  rot_acc_deg_s2: 20.0
  # RG2 최대 개폭. grasp/config/grasp_params.yaml의 gripper.max_opening_mm(110.0)과 같은 값 —
  # 그쪽은 파지 후보 계산용(mm), 여기는 GripperCommand 액션 호출용(m)이라 단위만 다르다.
  gripper_open_m: 0.110
  # place_into가 bin_pose.z까지 그대로 내려가면(예전 동작), bin_pose는 빈 그리퍼로 티칭한
  # 높이라 실제로 물체를 든 상태에서는 물체가 그 높이에 닿기 전에 바구니 바닥/기존 내용물에
  # 먼저 닿는다 — 실물에서 그리퍼가 열리기도 전에 충돌해 안전모드로 들어간 사고가 있었다.
  # 그리퍼를 여는 목표 z를 이 값만큼 위로 올려서 그 여유를 둔다.
  # TODO: 값 확정 — 30mm는 안전 쪽으로 보수적으로 잡은 시작값이다. 실물로 다시 확인해
  # 목적지 안에서 확실히 놓이는지(너무 높으면 떨어뜨리는 모양이 된다) 튜닝이 필요하다.
  release_clearance_mm: 30.0
  # pick이 grasp_pose.z까지만 내려가면 실물에서 접근이 부족해(파지 실패 진단 참조,
  # 2026-09-04) 그리퍼가 물체 위 허공에서 닫히는 경우가 있었다. 하강 목표 z를 이만큼
  # 더 낮춰서 여유를 둔다 — approach_posx는 이 낮아진 목표 기준으로 계산되므로
  # approach_height_mm만큼의 접근 여유는 그대로 유지된다.
  # TODO: 값 확정 — 15mm(2026-09-04 최초 시작값)로는 여전히 접근이 부족해 실물
  # 관찰로 30mm까지 올렸다. 바닥/트레이에 닿을 만큼 물체가 얇으면 과할 수 있어
  # 튜닝이 필요하다.
  pick_depth_extra_mm: 30.0

gripper:
  # 이 미만 개폭으로 닫히면 "닫혔지만 아무것도 안 물렸다"로 본다 — grasp_test/
  # robot_executor.py가 쓰는 것과 같은 기본값(RG2 개폭 기준 손가락이 완전히 맞닿는
  # 지점 근처, 5.0mm).
  min_grip_width_mm: 5.0

visual_verification:
  wrist_camera_offset_mm: null   # TODO: 그리퍼 사이 확인을 위한 상대이동값 (미확정). 단위 mm

home:
  # 2026-09-04 실측: dsr_msgs2/MoveJoint·MovejH2r이 요구하는 단위 그대로(도, deg/sec) 둔다.
  # bins.yaml의 pose(mm)와 달리 좌표 변환이 없어 units.py를 지나지 않는다(home_server.py 참조).
  joint_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]   # j1~j6
  vel_deg_s: 20.0
  acc_deg_s2: 20.0
