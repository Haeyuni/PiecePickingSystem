# grip_level별 힘/속도 파라미터 + 시각검증 상대이동값
# 미확정 — perception/config/objects.yaml의 grip_levels와 일치시켜 관리 (중복 정의 주의)
# 단위: 길이 mm, 힘 N (인터페이스_정의서.md 1.1절). approach_speed 단위는 objects.yaml의 TODO 참조
# TODO: 값 확정 (시스템명세서 미확정 항목 참조)
#
# 파지력 5단계: 1=가장 강하게(40N) ~ 5=가장 약하게(20N), 5N 간격.
# pick/place 실물 1단계(2026-09-04, 위치제어만)는 이 중 max_grip_force_n만 쓴다
# (그리퍼의 힘 제한 close, dsr_motion.move_gripper 참조) — approach_speed·
# contact_threshold_n은 compliance.py(순응제어, 아직 미구현)가 붙는 2단계의 몫이다.

grip_levels:
  1: { max_grip_force_n: 40.0, approach_speed: 0.25, contact_threshold_n: 8.0 }  # 매우 강하게
  2: { max_grip_force_n: 35.0, approach_speed: 0.25, contact_threshold_n: 7.0 }  # 강하게
  3: { max_grip_force_n: 30.0, approach_speed: 0.20, contact_threshold_n: 6.0 }  # 보통
  4: { max_grip_force_n: 25.0, approach_speed: 0.15, contact_threshold_n: 5.0 }  # 약하게
  5: { max_grip_force_n: 20.0, approach_speed: 0.08, contact_threshold_n: 3.0 }  # 매우 약하게

# --- Tool reference model (empirical, not independent physical geometry) ---
tool:
  # TCP to modeled pad/reference vector (tool frame, mm), not measured physical finger position.
  #
  # 왜 필요한가: 파이프라인이 내는 grasp_pose는 "손가락이 여기서 만나라"는 뜻인데,
  # movel은 그 자리에 **TCP 원점**을 보낸다. 두 점이 다르면 그 차이만큼 손끝이 빗나간다.
  # 툴 좌표계 상수라 자세와 함께 회전한다 — base 축에 상수를 더하는 방식(예전
  # pick_depth_extra_mm=40, camera_frame_offset_mm.z=45)은 수직 파지에서만 맞고
  # 기울어진 파지에서는 옆으로 샜다.
  #
  # 부호: **양수 z = 손끝이 TCP보다 접근 방향으로 더 나가 있다** = TCP를 파지점에 보내면
  # 손끝이 그만큼 더 깊이 들어간다. 그래서 control은 TCP를 그만큼 덜 보낸다
  # (dsr_motion.tcp_posx_for_grasp).
  #
  # --- 2026-09-07 historical estimate (superseded below) ---
  # 실측 두 개의 차이로 나온다. 둘 다 로봇 자신의 좌표만 쓴다(perception/티칭 불사용):
  #   실제 파지점 (플랜지 기준) = 233.2mm   <- measure_tcp_offset 방식, 고정점 3자세 최소제곱
  #                                          (잔차 1.2mm, 가로 성분 -4.6/-0.2 ~= 0 → 대칭 그리퍼와 일치.
  #                                           TF의 rg2_inner_finger 뿌리 184.7mm + 패드 ~48mm와도 맞는다)
  #   컨트롤러 TCP (플랜지 기준) = 208.0mm   <- get_current_posx 와 get_current_tool_flange_posx 의 차이
  #                                          (TCP 이름 GripperDA_v1, 순수 이동, 회전 오프셋 없음)
  #   → TCP → 파지점 = 233.2 - 208.0 = 25.2mm
  #
  # **이전 값 -18.3은 폐기했다.** 그건 컨트롤러에 TCP가 **선택돼 있지 않던 상태**에서
  # 잰 값이라, perception을 손끝이 아니라 플랜지와 비교한 숫자였다. 그때는
  # get_current_posx가 플랜지를 보고했고(TF link_6와 1.5mm 일치), hand-eye는 TCP가
  # 설정된 상태로 풀려 있어서 perception 좌표 전체가 툴 축으로 약 257mm 틀어져 있었다
  # (카메라 위치 오차: TCP 미설정 257.1mm → 설정 후 52.0mm).
  # 그 상태에서도 pick이 반쯤 되던 것은 두 오차(perception +257, 손끝 -233)가 서로
  # 상쇄돼 약 24mm만 남았기 때문이고, 그게 "허공에서 18~24mm 위에서 닫힘"의 정체였다.
  # place는 상쇄가 안 돼서 바구니/작업대를 찍었다(2026-09-06 "목표 213.4 → 217.9에서 멈춤" 사고).
  #
  # **드라이버/bringup 재시작 시 TCP 선택이 풀릴 수 있다.** 그러면 아무 오류 없이 전
  # 좌표가 208mm 틀어진다. 기동 후 반드시 확인할 것:
  #   ros2 service call /dsr01/dsr_controller2/tcp/get_current_tcp dsr_msgs2/srv/GetCurrentTcp "{}"
  #   → info 가 비어 있으면 TCP 미선택 상태다(정상은 'GripperDA_v1').
  #
  # 가로 성분(-4.6, -0.2)은 측정 불확실도(±4.3mm) 안이고 대칭 그리퍼의 파지점은 툴 축
  # 위에 있어야 하므로 0으로 둔다.
  # --- 2026-09-07 empirical adjustment: 25.2 -> 5.3 ---
  # WARNING: 5.3 = 89.1 - (81.8 + 2.0), from demonstrated TCP z minus the
  # pipeline's support+clearance reference, at a nearly vertical approach.
  # This is NOT independent geometry or an independent support-height validation.
  # RG2 opening changes finger/pad reach; one fixed offset does not model that motion.
  # A reconstructed reference below modeled support cannot alone prove physical contact
  # or establish that the old 25.2mm value was a tip rather than a pad measurement.
  grasp_center_offset_mm: {x: 0.0, y: 0.0, z: 5.3}

motion:
  # pick/place 실물 1단계에 쓰는 값. dsr_msgs2 movel_h2r이 요구하는 단위 그대로
  # (mm, mm/s, mm/s^2, deg/s, deg/s^2) 둔다 — home과 같은 이유(units.py를 지나지 않음).
  approach_height_mm: 80.0       # grasp_pose/bin_pose 바로 위에서 한 번 멈췄다 내려간다
  linear_vel_mm_s: 30.0
  linear_acc_mm_s2: 30.0
  rot_vel_deg_s: 20.0
  rot_acc_deg_s2: 20.0
  # place_into만 위 공용값보다 빠르게 움직인다 — place_server.py가 이 place_* 키를
  # 먼저 보고, 없으면 위 공용값으로 떨어진다. pick은 이 키를 보지 않으므로 그대로
  # 30/30/20/20을 쓴다.
  #
  # 2026-09-06 (1차): 공용값의 2배 → 60/60/40/40.
  # 2026-09-06 (2차, 요청): 그 값의 1.5배 → 90/90/60/60 (공용값 기준 3배).
  # 속도만 올리고 가속도를 그대로 두면 짧은 구간은 가속 구간만으로 끝나 실제로는
  # 안 빨라지므로 가속도도 같은 비율로 올린다(1차 변경 때와 같은 방식).
  place_linear_vel_mm_s: 90.0
  place_linear_acc_mm_s2: 90.0
  place_rot_vel_deg_s: 60.0
  place_rot_acc_deg_s2: 60.0
  # RG2 최대 개폭. grasp/config/grasp_params.yaml의 gripper.max_opening_mm(110.0)과 같은 값 —
  # 그쪽은 파지 후보 계산용(mm), 여기는 GripperCommand 액션 호출용(m)이라 단위만 다르다.
  gripper_open_m: 0.110
  # 놓는 z = bin_pose.z + (물체가 TCP 아래로 내려온 양) + 이 값.
  #
  # 2026-09-06 이전에는 이 값 **하나로** 두 가지를 동시에 감당했다 — 물체 높이 보정과
  # 안전 여유. 물체마다 높이가 다르니 한 값으로는 맞출 수 없었고, 큰 물체에서는 모자라
  # 물체가 바구니 바닥에 먼저 닿아 안전모드로 들어갔다(실물: 목표 213.4mm인데 217.9mm에서
  # 멈춤 → 알람 → heartbeat 유실 → 권한 회수).
  # 이제 물체 높이는 perception이 depth로 실측해(DetectedObject.height_mm) 따로 더하므로,
  # **이 값은 순수한 안전 여유**다 — 물체가 커져도 이 값은 그대로 두면 된다.
  #
  # 2026-09-08 (요청) 30.0 → 70.0. 실물 시행에서 물체가 바구니 벽/테두리에 걸리는
  # 모습이 다시 보여 방향을 되돌린다 — "보정분이 이미 더해지니 줄여도 된다"는 논리가
  # 실물에선 아직 성립하지 않는다. **높이는 충돌 내성이 있는 방향**이므로, 물체별
  # 높이 보정이 실물에서 반복해서 맞는 것을 확인하기 전까지 이 값을 유지한다.
  release_clearance_mm: 70.0
  # place_into 접근 이동을 "현재 위치 → 안전고도 → 바구니 상공 → 하강" 3단계로 할 때,
  # 안전고도 = max(현재 z, 바구니 접근 z) + 이 값. 픽 직후 위치와 바구니 접근 높이
  # 둘 중 더 높은 곳보다도 이만큼 더 올라가야 그 사이(작업대·다른 물체·바구니 테두리)를
  # 확실히 넘어간다는 뜻이다 — 둘 중 큰 값 자체를 그대로 쓰면(2026-09-05 이전 코드)
  # 안전 여유가 전혀 없었다. place_server가 이 높이에서 ikin으로 실제 도달 가능한지
  # 확인해 안 되면 단계적으로 낮추므로, 여기 값은 "이상적으로 원하는" 여유이지
  # 그대로 강행하는 값이 아니다.
  # 2026-09-07 (실물) 100.0 → 20.0. **100은 팔이 안 닿는 높이를 만들었다.**
  #   release_z 213.8 + 접근 80 = 293.8, 거기에 100을 더해 안전고도 393.8이 됐는데,
  #   그 높이에서 바구니 상공(334.7, -479.2)으로 가려면 J3가 171도까지 가야 한다
  #   (한계 150도). movel은 오류를 내지 않고 **그냥 안 움직여서** 60초 타임아웃으로
  #   끝났다 — "바구니 상공으로 수평 이동 실패"의 정체가 이것이다.
  #   TCP(GripperDA_v1, 208mm)를 복구하면서 플랜지가 그만큼 더 뻗어야 해져
  #   (704 → 839mm, M0609 최대 900mm) 도달 범위가 줄어든 결과다.
  #
  # ikin 실측(2026-09-07, 이 셀의 left_box 기준): 293.8~333.8은 전부 도달 가능하고
  # 관절해도 안정적이다. 343.8은 X, 353.8은 O로 **경계 근처는 해가 널뛰므로** 피한다.
  # 20을 쓰면 안전고도 313.8 = 손끝 308.5 = 작업대 위 227mm.
  # 지금 씬에서 가장 높은 물체 윗면이 약 230(작업대 위 148mm)이라 78mm 여유가 남는다.
  # (파지 깊이 정책상 물체 바닥이 거의 손끝 높이라, 손끝만 넘으면 물체도 넘어간다.)
  #
  # place_server가 시작 시 ikin으로 도달 가능성을 확인하고 안 되면 20mm씩 낮추므로
  # 이 값은 "이상적으로 원하는 여유"이고, 못 닿으면 자동으로 낮아진다.
  place_safe_clearance_mm: 20.0
  # place_into 완료 뒤 orchestrator가 곧바로 home(관절이동)을 부른다(web/orchestrator.py
  # _execute_steps). place_server가 물러나는 높이(bin 접근 높이)에서 바로 관절이동을
  # 시작하면 바구니 테두리 바로 위라 여유가 적어, place_into 마지막에 이만큼 더
  # 올라간 뒤 결과를 반환한다.
  # 2026-09-07 (실물) 200.0 → 40.0. 바구니는 팔 범위 **가장자리**라 그 XY에서 위로
  # 얼마 못 올라간다. 293.8 + 200 = 493.8을 명령했더니 movel이 오류 없이 그냥 안 움직여
  # 60초 타임아웃 → "home 이동 전 상승 실패"로 place 전체가 실패했다(놓기까지는 정상이었다).
  # ikin 실측: 이 셀의 left_box XY에서 293.8~333.8이 안정적으로 도달 가능하다.
  # place_server가 도달 가능성을 확인해 안 되면 자동으로 낮추므로 이 값은 상한이다.
  home_rise_mm: 40.0
  # pick이 grasp_pose.z까지만 내려가면 실물에서 접근이 부족해(파지 실패 진단 참조,
  # 2026-09-04) 그리퍼가 물체 위 허공에서 닫히는 경우가 있었다. 하강 목표 z를 이만큼
  # 더 낮춰서 여유를 둔다 — approach_posx는 이 낮아진 목표 기준으로 계산되므로
  # approach_height_mm만큼의 접근 여유는 그대로 유지된다.
  # TODO: 값 확정 — 15mm(2026-09-04 최초 시작값)로도 접근이 부족해 30mm로 올렸었고,
  # 2026-09-05 실물 재확인으로 40mm까지 올렸다. 바닥/트레이에 닿을 만큼 물체가 얇으면
  # 과할 수 있어 튜닝이 필요하다.
  #
  # 2026-09-07 (잠정) 40.0 → 15.0. 근거와 남은 불확실성:
  #   근거 — GraspNet 후보(z=325.3, 물체 윗면 332.4 / 바닥 315.4)에 40mm를 더 빼면
  #          하강 목표가 287.5로 **물체 바닥보다 28mm 아래**, 즉 작업대 속이 된다.
  #          게다가 grasp_params.yaml의 T_graspnet_tcp_mm 접근축 +9.2mm가 같은 방향으로
  #          이미 더해지고 있어 이중 계산이다.
  #   불확실 — 위 이력(15→30→40)은 "허공에서 닫힌다"가 이유였다. PCA 후보(윗면-8mm)에
  #          40을 빼도 작업대 아래인데 PCA로는 잡혔다는 건, perception의 z가 실제보다
  #          30~40mm 높고 이 값이 그 편차를 상쇄해 왔다는 뜻일 수 있다. 그렇다면 낮추는
  #          순간 다시 허공에서 닫힌다.
  #   확정 방법 — pick_server의 [파지오차] 로그에서 dz를 본다.
  #          dz≈0(명령한 z에 실제로 도달)  → 작업대가 그보다 낮다 = perception z 편차 확정.
  #                                         이 값을 되돌리고 perception 쪽을 고쳐야 한다.
  #          dz가 크게 양수(못 내려감)     → 작업대에 막힌 것 = 이 값을 더 낮춘다.
  #
  # 2026-09-07 (2차, 실측 5회 근거) 15.0 → 0.0.
  #   [파지오차] 로그 5건 전부 d=(±0.2, 0.0, ±0.2)mm — 로봇은 명령한 자리에 정확히 가고
  #   z=283mm까지 막힘 없이 내려갔다. 즉 "perception z가 높게 나와 이 값이 상쇄해 왔다"는
  #   가설은 기각이다. 목표 자체가 틀렸던 것.
  #   GraspNet 후보는 **파지점 그 자체**(물체 중간높이)라 거기서 더 파고들 이유가 없다.
  #   17mm 물체에 40mm를 더 가면 관통해서 반대편으로 나가고, 기울기가 크면 옆으로도
  #   밀린다(34.3도 후보 기준 40mm = (+21.2, +7.8, -33.0), X로 21mm 이탈).
  #
  # heuristic_pca로 되돌릴 때 주의: PCA 후보는 "물체 윗면 -8mm"라 안쪽으로 더 들어가야
  # 할 수 있다. 허공에서 닫히면 5~10mm부터 다시 올릴 것(예전 40은 과했던 값으로 보인다 —
  # 그 값으로도 PCA가 잡혔던 건 로봇이 물체/작업대에 막혀 멈춘 뒤 닫혔기 때문일 수 있다).
  # 2026-09-07 (3차) 0.0 → 10.0. depth 계통 오차 보정은 **여기가 아니라**
  # grasp_params.yaml의 camera_axis_offset_mm으로 옮겼다 — 오차의 출처가 depth라
  # 카메라 시선축으로 밀어야 하고, 접근축으로 밀면(이 값) 기울어진 파지에서 옆으로 샌다.
  # 여기 남은 10mm는 순수하게 "후보 지점보다 물체 안쪽으로 조금 더" 몫이다.
  #
  # 2026-09-07 (4차) 10.0 → 0.0. **이 값이 겸하던 일이 없어졌다.**
  # 지금까지 이 값(과 예전의 40mm)이 실제로 메우던 것은 TCP 원점과 손끝의 차이였고,
  # 그건 이제 tool.grasp_center_offset_mm이 자세와 함께 회전시켜 정확히 처리한다.
  # 둘을 함께 두면 같은 오차를 두 번 빼게 된다.
  #
  # 파지 깊이 자체("후보 지점보다 물체 안쪽으로 얼마나")는 **전략이 정한다** —
  # grasp_params.yaml의 refine_grasp_depth_mm(GraspNet) / grasp_depth_mm(PCA)이 그것이고,
  # 그쪽은 물체의 실제 클라우드를 보고 정하므로 얇은 물체에서 작업대를 뚫지 않는다
  # (grasp/node.py의 지지면 보호 참조). control은 그 결정을 그대로 실행만 한다.
  #
  # 실물에서 여전히 얕게 물면 이 값이 아니라 refine_grasp_depth_mm을 올릴 것.
  # 여기를 올리면 지지면 보호를 지나친 뒤에 더해지므로 작업대를 누를 수 있다.
  pick_depth_extra_mm: 0.0

gripper:
  # 이 미만 개폭으로 닫히면 "닫혔지만 아무것도 안 물렸다"로 본다.
  # 5.0mm는 RG2 개폭 기준 손가락이 완전히 맞닿는 지점 근처다.
  min_grip_width_mm: 5.0
  # pick 전 그리퍼를 GraspCandidate.width_mm + 이 값만큼만 연다(pick_server._open_width_m).
  # width_mm을 모르면(0) 대신 motion.gripper_open_m(최대)까지 연다.
  # 2026-09-08 (사용자 요청, 실물 관찰) 30.0 → 34.0: 여유를 3~5mm 더 준다.
  # 30mm는 실물 확인 전 잡은 시작값이었는데("접근 중 손가락이 물체를 스치지 않을
  # 정도"), 실제로 보면 딱 맞거나 약간 모자라 보이고 **접근 중 물체가 손가락 끝에
  # 걸리는 경우**가 있었다. 계산된 물체폭 자체가 실물보다 좁게 나오는 쪽이라
  # 여유로 흡수한다.
  # **이 값은 grasp_selection.score_width_fit의 comfort_hi(= 최대개폭 - 이 값)로도
  # 쓰인다**(pick_server._selection_params — 같은 뜻의 값을 두 군데서 읽지 않기 위해서).
  # 30.0 → 34.0으로 comfort_hi가 80 → 76mm가 된다. 이건 부작용이 아니라 정의상
  # 맞는 이동이다 — 여유가 34mm면 76mm보다 넓은 물체는 폭+여유가 최대개폭 110mm를
  # 넘어 목표 개폭을 못 만든다. 두 값이 같은 이유로 함께 움직여야 한다.
  width_margin_mm: 34.0
  # 닫을 때 **목표 개폭 = 물체폭 x 이 비율**.
  # 'c'(완전 닫기)로 닫으면 빈 그리퍼에서도 손가락끼리 부딪혀 힘 한계에 도달해
  # Grip detected가 켜진다 — 실제로 아무것도 안 잡고 "성공" 판정이 났다(2026-09-07).
  # 물체폭보다 좁게 목표를 주면: 물체 있음→막혀서 힘 걸림(grip=True),
  # 물체 없음→목표까지 저항 없이 닫힘(grip=False). 그래야 판정이 성립한다.
  #
  # 고정 mm가 아니라 비율인 이유: 10mm를 빼는 방식은 110mm 물체에서 91%(거의 안 조임),
  # 15mm 물체에서 33%(과하게 조임)가 되어 물체 크기에 따라 조임 정도가 널뛴다.
  # 하한은 min_grip_width_mm이다 — 그 아래로 내려가면 'c'와 다를 게 없어진다.
  # 2026-09-08 (사용자 요청) 0.8 → 0.6: 더 세게 물리도록. 물체가 가늘수록(예: 15mm 폭)
  # 목표 개폭이 min_grip_width_mm(5.0)에 더 가까워지니, 얇은 물체에서 오작동(빈 그리퍼
  # 오판정)이 늘면 이 값을 다시 올릴 것.
  grip_close_ratio: 0.6
  # 그리퍼를 **열 때** 쓰는 힘(N). 닫기에서 낮은 힘(fragile 5N)을 설정하면 드라이버가
  # 그 값을 유지하므로, 열기에는 항상 이 값을 명시해 상태 의존을 없앤다. RG2 최대는 40N.
  open_force_n: 40.0

# --- 파지 후보 최종 선택 (control/grasp_selection.py) --------------------------
# planner가 GraspNet 후보를 **순위대로 전부** 넘기고, 실행할 하나는 control이 고른다.
# 로봇에 붙어 있어야만 답할 수 있는 것들(IK, 관절 한계)이 판정에 들어가기 때문이다.
#
# 검사 순서: 개폭 → 접근/파지 IK → 관절 한계 → 최소 안전 → (통과한 것들만) 점수 랭킹.
# 실행 전에 탈락한 후보는 다음 후보로 넘어간다 — 후보 하나가 안 된다고 pick 전체가
# 실패하지 않는다. 전부 탈락하면 로봇을 움직이지 않고 no_feasible_grasp로 끝낸다.
#
# **여기서 하지 않는 것**: 3D collision 검사, 주변 물체와의 간섭 예측, 특이점 판정,
# 경로(두 끝점 사이) 검사. grasp_selection.py 모듈 docstring에 이유가 적혀 있다.
grasp_selection:
  # 검사할 후보 수 상한. ikin 한 번이 실측 약 31ms(2026-09-07, 이 셀)라 후보당 접근+파지
  # 2회 = 약 66ms다. grasp_params.yaml의 top_k(10)와 맞춰 두면 받은 만큼 전부 본다.
  max_evaluated: 10

  # 지지면(= 물체 윗면 z - height_mm)보다 이만큼까지 내려가는 것은 허용한다.
  # 손끝 위치 자체가 모델값이라(tool.grasp_center_offset_mm — 실측 기하가 아니다)
  # 0으로 두면 모델 오차만으로 멀쩡한 후보가 탈락한다.
  support_tolerance_mm: 5.0

  # 작업대의 절대 높이(TCP z 하한). **미설정(null)이 기본이다** — 이 셀의 작업대 높이를
  # 접촉으로 재본 적이 없어서 넣을 숫자가 없다. 재고 나면 여기에 넣으면 물체 높이를
  # 모르는(height_mm=0) 후보까지 바닥 침범으로 걸러진다.
  min_tcp_z_mm: null

  # 관절 한계(도). 비워두면 dsr_description2/urdf/m0609.urdf 값(J3만 150, 나머지 360)을 쓴다.
  # 컨트롤러 소프트 리밋이 더 좁으면 여기서 좁힌다.
  # joint_limits_deg: [360.0, 360.0, 150.0, 360.0, 360.0, 360.0]

  # 이보다 좁은 예상 개폭은 "손끝이 스칠 위험"으로 보고 점수를 깎는다(탈락은 아니다).
  # **측정 근거가 없는 튜닝값이다.** 얇은 물체를 자꾸 놓치면 올리고, 멀쩡한 후보가
  # 밀리면 내린다.
  comfort_min_width_mm: 15.0
  # 중심 근접도를 나눌 길이의 하한(mm). 보통은 후보들의 최대 개폭 절반(물체 반폭 추정)을
  # 쓰고, 그게 이보다 작을 때만 이 값을 쓴다.
  center_scale_floor_mm: 20.0
  # 관절 여유가 이 이상이면 만점(도). M0609는 J3만 ±150이라 사실상 J3 여유를 보는 항이다.
  joint_margin_ref_deg: 30.0

  # --- 접근 적합도 (2026-09-08, 2.5차) ---------------------------------------
  # 접근각을 grasp 단계에서 hard filter로 자르지 않게 되면서(grasp_params.yaml의
  # approach_angle_hard_max_deg 참조) 그 판단이 여기로 왔다. 예전 hard filter가 쓰던
  # 숫자를 감점 곡선의 꼭짓점으로 그대로 물려받아 추적이 되게 했다.
  #
  #   angle <= prefer(15)  → 1.0   (예전 approach_angle_threshold_deg와 같은 값)
  #   angle == soft(30)    → 0.5   (예전 approach_angle_max_deg = 잘리던 선.
  #                                 "예전에 탈락하던 각도 = 절반짜리 후보"로 읽으면 된다)
  #   angle >= zero(75)    → 0.0   (grasp의 hard 상한과 같은 값 — 그 위는 애초에 안 온다)
  #
  # **zero는 grasp_params.yaml의 approach_angle_hard_max_deg와 같이 움직여야 한다.**
  # 거기만 넓히고 여기를 두면 새로 들어온 각도들이 전부 0점으로 뭉쳐 서로 구분이 안 된다.
  approach_angle_prefer_deg: 15.0
  approach_angle_soft_max_deg: 30.0
  approach_angle_zero_deg: 75.0

  # 지금 TCP에서 접근 지점까지의 이동량/회전량 정규화 기준. 이만큼 움직여야 하면 0점.
  # **도달 가능성 판정이 아니다** — 그건 IK가 이미 봤다. 같은 값이면 지금 자세에서 덜
  # 움직여도 되는 후보를 고르자는 선호도이고, 그만큼 사이클이 짧고 경로가 단순하다.
  # 현재 자세를 못 읽으면(movel 직후 aux_control 무응답 구간) 이 항만 빠진다.
  approach_travel_ref_mm: 400.0
  approach_rotation_ref_deg: 120.0

  # 점수 가중치. 각 항은 [0,1]로 정규화돼 있고, 판단할 정보가 없는 항은 빠진 뒤 남은
  # 가중치로 다시 정규화된다(정보 없음이 감점이 되지 않게).
  # **GraspNet score는 여러 판단 요소 중 하나일 뿐이다** — 그것만으로 고르던 것을
  # 바꾸는 것이 이 블록의 목적이다.
  weights:
    grasp_score: 0.30       # GraspCandidate.score (전략이 이미 0~1로 clip해서 낸다)
    width_fit: 0.15         # RG2 개폭 적합성 (너무 넓으면 최대개방으로 떨어지고, 너무 좁으면 스친다)
    center_proximity: 0.15  # 파지점이 물체 중심(xy)에 가까운가
    height_fit: 0.10        # 물체 높이의 중간을 무는가 (윗모서리만 물면 미끄러진다)
    joint_margin: 0.10      # 관절 한계까지 여유
    depth_quality: 0.05     # depth_valid_ratio. 물체 단위 값이라 같은 물체 안에서는 동점이다
    # 2026-09-08(2.5차) 추가. grasp이 각도로 미리 자르지 않게 된 만큼 그 판단이 여기로
    # 왔다 — 합을 1로 유지하려고 grasp_score/width_fit/center_proximity에서 덜어냈다.
    # **접근각을 너무 올리면 예전 hard filter와 같아진다**(수직 후보만 뽑힘). 기울어진
    # 후보가 계속 뽑혀 미끄러지면 올리고, 멀쩡한 후보가 각도만으로 밀리면 내린다.
    approach_angle: 0.10    # 수직에 가까운 접근인가
    approach_travel: 0.05   # 지금 자세에서 접근 지점까지 얼마나 움직여야 하나


visual_verification:
  wrist_camera_offset_mm: null   # TODO: 그리퍼 사이 확인을 위한 상대이동값 (미확정). 단위 mm

home:
  # 2026-09-04 실측: dsr_msgs2/MoveJoint·MovejH2r이 요구하는 단위 그대로(도, deg/sec) 둔다.
  # bins.yaml의 pose(mm)와 달리 좌표 변환이 없어 units.py를 지나지 않는다(home_server.py 참조).
  joint_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]   # j1~j6
  vel_deg_s: 20.0
  acc_deg_s2: 20.0
