# Copy to ~/grasp_test_assets/grasp_test.local.yaml. Paths must be absolute.
assets:
  yolo_weight: /home/USER/grasp_test_assets/yolo/best.pt
  checkpoints: /home/USER/grasp_test_assets/checkpoints
results_dir: /home/USER/grasp_test_assets/results
camera:
  color_topic: /camera/color/image_raw
  depth_topic: /camera/aligned_depth_to_color/image_raw
  info_topic: /camera/color/camera_info
  frame: camera_color_optical_frame
  min_confidence: 0.50
  min_mask_pixels: 200
  min_depth_valid_ratio: 0.35
robot:
  base_frame: base_link
  pose_service: /dsr01/dsr_controller2/aux_control/get_current_posx
  handeye_path: /home/USER/workspace/PiecePickingSystem/data/calibration/T_gripper2camera.npy
  # IK/collision pre-check (motion_precheck.py — Doosan Ikin API directly, not MoveIt2).
  # execute:=true stays DRY_RUN_ONLY until /dsr01/dsr_controller2/motion/ikin is reachable
  # (checked live, not a config value) — IK checking can never be skipped.
  # Collision checking (obstacles + gripper_radius_m below) is best-effort and OPTIONAL: if
  # either is unset, motion_precheck.py runs IK-only and logs a WARN on every trial instead of
  # blocking — this must be an explicit, informed operator decision (direct supervision +
  # E-stop at the robot), not a default to rely on. Collision checking itself, even when
  # configured, is a hand-rolled sphere(gripper_radius_m)-vs-AABB(obstacles) sweep along each
  # approach/grasp/lift segment — NOT a full-body/URDF check; it doesn't know the arm's
  # forearm/elbow shape or the exact RG2+camera bracket geometry, only a single sphere around
  # the TCP. Keep gripper_radius_m conservative (larger than the true envelope).
  # Strongly recommended: measure this cell's table/box/jig and fill in obstacles (meters, base frame).
  obstacles: []
  # obstacles: [{name: table, center_m: [x, y, z], size_m: [length, width, height]}, ...]
  # MANUAL_REQUIRED: conservative radius (m) of a sphere around the TCP that contains the RG2
  # gripper + camera bracket in every gripper open/close state. No default — must be measured.
  gripper_radius_m: null
  # Waypoint spacing (m) used when sweeping each segment for collisions. Smaller = more thorough,
  # slower. 0.01 (1cm) is a reasonable default; no need to change unless obstacles are very thin.
  path_check_step_m: 0.01
  # /dsr01/motion/movej_h2r, /dsr01/motion/movel_h2r (verified via `ros2 action list` on the
  # robot PC, 2026-09-04). robot_executor.py talks to them directly, not through control/'s
  # sort_msgs Pick/Home wrappers. See robot_executor.py module docstring for why.
  # z lower bound below doubles as the safety floor above the table/bin.
  workspace_mm: {x: [-500, 500], y: [-500, 500], z: [0, 500]}
  approach_height_mm: 80.0
  linear_vel_mm_s: 30.0
  linear_acc_mm_s2: 30.0
  rot_vel_deg_s: 20.0
  rot_acc_deg_s2: 20.0
  # j1~j6 deg. MUST match the robot's actual taught Home posture for this cell.
  home_pose_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]
  home_vel_deg_s: 20.0
  home_acc_deg_s2: 20.0
rg2:
  expected_model: rg2
  # onrobot_rg_msgs/srv/SetCommand+GripperPose (/onrobot/sendCommand, /onrobot/pose), verified
  # on the robot PC (2026-09-04). The vendor's /rg6_controller action name is fixed even for
  # RG2, so the driver itself MUST be launched with `gripper:=rg2`. This package does not use
  # that unreliable action; it uses SetCommand/GripperPose below.
  # Closing force isn't configurable through this path (server default, conservative); there is
  # no gripper_effort_n knob here anymore.
  min_grip_width_mm: 5.0
  max_grip_width_mm: 100.0
  # Direct Modbus control is deliberately unsupported here; use an existing verified ROS interface.
model:
  max_inference_ms: 30000
