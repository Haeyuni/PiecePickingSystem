# 서비스 개요는 시스템명세서.md 5.2절 참조.
# ROS2 패키지는 src/, 프론트엔드는 web/, 독립 서비스는 services/ 아래에 둔다.
# 환경변수는 .env에서 읽는다 (.env.example 참조).
#
# B0 시점에 뜨는 것은 db + planner다. web/perception/grasp/control의 이미지는
# 각 계층 착수 시점에 채운다 (개발계획.md 4.2절).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-piece_picking}
      POSTGRES_USER: ${POSTGRES_USER:-piece_picking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # host 네트워크로 뜨는 web_ros가 서비스 이름 DNS를 못 쓰기 때문에 게시한다
      - "5432:5432"
    healthcheck:
      # planner가 마이그레이션을 돌리기 전에 DB가 실제 쿼리를 받을 수 있어야 한다
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-piece_picking} -d ${POSTGRES_DB:-piece_picking}"]
      interval: 3s
      timeout: 3s
      retries: 20

  perception:
    build:
      # 컨텍스트가 저장소 루트인 이유는 src/perception/Dockerfile 주석 참조 (sort_msgs·perception_common을 함께 빌드)
      context: .
      dockerfile: src/perception/Dockerfile
    depends_on:
      db:
        condition: service_started
    network_mode: host   # 카메라(realsense2_camera)·get_current_posx·grasp 구독자를 host DDS에서 봐야 한다
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      CYCLONEDDS_URI: file:///cyclonedds/cyclonedds.xml
      # 컨테이너 내부 경로. 호스트의 data/calibration/을 아래 볼륨으로 마운트한 위치를 가리킨다.
      HANDEYE_PATH: /data/calibration/T_gripper2camera.npy
      # host 네트워크라 서비스 이름 DNS가 없다 (web_ros와 같은 이유) — 게시된 포트로 부른다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-piece_picking}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB:-piece_picking}
      # *.pt는 이미지에 굽지 않는다(.gitignore) — 아래 볼륨이 가리키는 호스트 파일을 그대로 쓴다.
      PERCEPTION_MODEL: /models/best.pt
    volumes:
      - ${CYCLONEDDS_CONFIG_DIR:-${HOME}/.config/cyclonedds}:/cyclonedds:ro
      # dsr_msgs2(get_current_posx 서비스 타입)의 출처. src/perception/docker-entrypoint.sh 참조.
      - ${DOOSAN_WS_DIR:-${HOME}/cobot2_ws}/install/dsr_msgs2:/doosan_ws:ro
      - ./data:/data:ro
      # 신규 클래스 크롭 저장(node.py:_maybe_save_unknown_crop, 시스템명세서 4.4절)은
      # 유일하게 쓰기가 필요한 경로다 — 그 아래만 별도로 rw 마운트한다. /data 전체를
      # rw로 열면 캘리브레이션 결과 같은 입력을 실수로 덮어쓸 수 있어 그건 막아 둔다.
      - ./data/unknown_crops:/data/unknown_crops:rw
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # GraspNet-baseline 추론 서버 (grasp 노드의 graspnet_baseline 전략이 쓴다).
  #
  # **왜 상주 서비스인가.** 원래는 grasp 전략이 추론 때마다 `docker run`으로 이 이미지를
  # 1회용으로 띄웠다. 그러면 호출 한 번마다 컨테이너 기동 + torch/CUDA import + 모델 생성
  # + checkpoint 로드를 전부 다시 해서 추론 1회가 수십~수백 초가 됐다(실물에서 60초
  # 타임아웃이 연속 초과돼 180초로 올려야 했다 — grasp_params.yaml의 timeout_s 참조).
  # 게다가 그 방식은 grasp 노드에 Docker socket/CLI가 있어야 해서 compose 컨테이너로는
  # 못 돌리고 호스트 네이티브 실행이 강제됐다(src/grasp/Dockerfile 주석).
  # 여기서 모델을 기동 시 한 번만 올리고 HTTP로 받으면 그 둘이 동시에 없어진다.
  #
  # 네트워크: grasp가 network_mode: host라 서비스 이름 DNS를 못 쓴다 — planner/db와 같은
  # 이유로 포트를 게시하고 localhost로 부른다(grasp_params.yaml의 endpoint).
  graspnet:
    build:
      context: src/grasp/docker/graspnet_baseline
    # 이미지는 compose가 위 build 컨텍스트에서 직접 만든다. checkpoint만 assets에서
    # 마운트하면 되고, 별도 셋업 스크립트는 없다.
    image: piece-picking-graspnet-baseline:0.2.0
    command: ["--serve", "/checkpoint.tar", "cuda:0", "8200"]
    volumes:
      # checkpoint는 Git 밖의 assets에 둔다(src/grasp/config/assets.example.yaml).
      - ${PIECE_PICKING_ASSETS_DIR:-${HOME}/piece_picking_assets}/models/graspnet/checkpoint.tar:/checkpoint.tar:ro
    ports:
      - "8200:8200"
    healthcheck:
      # /health는 **모델을 다 올린 뒤에** 열린다 — 200이면 곧바로 추론을 받을 수 있다는 뜻.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      # 모델 로드(checkpoint.tar + CUDA 초기화)에 걸리는 시간. 넉넉히 준다.
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  grasp:
    build:
      # 컨텍스트가 저장소 루트인 이유는 src/grasp/Dockerfile 주석 참조 (sort_msgs·perception_common을 함께 빌드)
      context: .
      dockerfile: src/grasp/Dockerfile
    # graspnet에 depends_on을 걸지 않는 이유: 어떤 전략을 쓸지는 grasp가 런타임에
    # grasp_params.yaml에서 고른다(heuristic_pca면 graspnet이 아예 필요 없다). 하드
    # 의존을 걸면 PCA로 돌 때도 매 기동마다 모델 로드를 기다려야 한다. graspnet 전략인데
    # 서버가 아직 안 떴으면 그 관측만 후보 없이 건너뛰고 로그를 남긴 뒤, 서버가 뜨면
    # 그냥 이어서 동작한다.
    depends_on: [perception]
    network_mode: host   # perception의 world_state_raw/instance_masks + get_current_posx를 host DDS에서 봐야 한다
    # 파지 전략. grasp_launch.py의 strategy 인자가 node.py에서 grasp_params.yaml의
    # strategy.name보다 우선하므로, 이미지 재빌드 없이 여기서 바꾼다.
    #
    # 2026-09-07: 기본값을 graspnet_baseline으로 올렸다(요청). 되돌리려면:
    #   GRASP_STRATEGY=heuristic_pca docker compose up -d grasp
    # 빈 문자열은 쓸 수 없다 — ros2 launch가 'strategy:='를 malformed로 거부한다.
    #
    # graspnet_baseline은 위 graspnet 서비스(상주 추론 서버)가 떠 있어야 동작한다.
    # 서버가 없으면 그 관측만 후보 없이 건너뛰고 로그를 남긴다(연쇄 실패는 없다).
    command: ["ros2", "launch", "grasp", "grasp_launch.py", "strategy:=${GRASP_STRATEGY:-graspnet_baseline}"]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      CYCLONEDDS_URI: file:///cyclonedds/cyclonedds.xml
      # 컨테이너 내부 경로. 호스트의 data/calibration/을 아래 볼륨으로 마운트한 위치를 가리킨다.
      HANDEYE_PATH: /data/calibration/T_gripper2camera.npy
    volumes:
      - ${CYCLONEDDS_CONFIG_DIR:-${HOME}/.config/cyclonedds}:/cyclonedds:ro
      # dsr_msgs2(get_current_posx 서비스 타입)의 출처. src/grasp/docker-entrypoint.sh 참조.
      - ${DOOSAN_WS_DIR:-${HOME}/cobot2_ws}/install/dsr_msgs2:/doosan_ws:ro
      - ./data:/data:ro
      # 파지 파라미터는 **튜닝 대상**이라 이미지에 굽지 않고 마운트한다. 안 그러면 값 하나
      # 바꿀 때마다 이미지 재빌드가 필요해서 실물 앞에서 값을 좁혀 나가는 게 사실상 불가능하다.
      # (2026-09-07) 이제 파일을 고치고 `docker compose restart grasp`만 하면 반영된다.
      - ./src/grasp/config/grasp_params.yaml:/ros2_ws/install/grasp/share/grasp/config/grasp_params.yaml:ro
      # 캘리브레이션·진단 스크립트. grasp 컨테이너는 rclpy + sort_msgs + dsr_msgs2 +
      # perception_common을 모두 갖춘 유일한 곳이라 이 도구들이 그대로 돈다.
      # 마운트하는 이유는 컨테이너를 다시 만들 때마다 docker cp를 반복하지 않기 위해서다
      # (예전에는 /tmp에 복사해 썼는데 재기동하면 사라졌다):
      #   docker exec ros2_ws-grasp-1 bash -c 'source /opt/ros/jazzy/setup.bash &&
      #     source /ros2_ws/install/setup.bash &&
      #     source /doosan_ws/share/dsr_msgs2/local_setup.bash &&
      #     python3 /tools/measure_tcp_offset.py'
      - ./tools/calibration:/tools:ro
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  planner:
    build: ./services/planner
    depends_on:
      db:
        condition: service_healthy
    environment:
      # LLM/VLM은 OpenAI API (개발계획.md D-3). 키는 .env에 두고 이미지에 굽지 않는다
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      DATABASE_URL: postgresql://${POSTGRES_USER:-piece_picking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-piece_picking}
    volumes:
      # 스키마·시드는 이미지 밖에 둔다 (services/planner/Dockerfile 주석 참조)
      - ./database/migrations:/migrations:ro
      - ./src/perception/config/objects.yaml:/config/objects.yaml:ro
      # 그라운딩 대상 목적지 목록 (control이 소유하는 파일을 읽기 전용으로 공유)
      - ./src/control/config/bins.yaml:/config/bins.yaml:ro
      # 캘리브레이션 결과 등 공용 데이터 (개발계획.md D-2)
      - ./data:/data:ro
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  control:
    build:
      # 컨텍스트가 저장소 루트인 이유는 src/control/Dockerfile 주석 참조 (sort_msgs를 함께 빌드)
      context: .
      dockerfile: src/control/Dockerfile
    network_mode: host   # DDS 통신 단순화
    environment:
      # 실물 로봇 연동 전까지 기본값. 실제 로봇에 붙일 때 compose 기동 시 FAKE_ROBOT=0으로 덮어쓴다.
      FAKE_ROBOT: ${FAKE_ROBOT:-1}
      # 호스트의 control/perception 노드와 같은 도메인이어야 서로 보인다 (web_ros와 동일 이유)
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      CYCLONEDDS_URI: file:///cyclonedds/cyclonedds.xml
    volumes:
      - ${CYCLONEDDS_CONFIG_DIR:-${HOME}/.config/cyclonedds}:/cyclonedds:ro
      # dsr_msgs2(MovejH2r/MovelH2r 액션 타입)의 출처. src/control/docker-entrypoint.sh 참조.
      - ${DOOSAN_WS_DIR:-${HOME}/cobot2_ws}/install/dsr_msgs2:/doosan_ws:ro
      # onrobot_rg_msgs(SetCommand/GripperPose 타입, dsr_motion.py 참조) — 같은 이유로
      # 패키지 하나만 마운트한다(cobot2_ws 전체를 마운트하면 안 되는 이유는
      # src/control/docker-entrypoint.sh 참조).
      - ${DOOSAN_WS_DIR:-${HOME}/cobot2_ws}/install/onrobot_rg_msgs:/onrobot_ws:ro
      # 모션/목적지 파라미터도 튜닝 대상이라 마운트한다(grasp_params.yaml과 같은 이유).
      # 고치고 `docker compose restart control`이면 반영된다 — 재빌드 불필요.
      - ./src/control/config/skill_params.yaml:/ros2_ws/install/control/share/control/config/skill_params.yaml:ro
      - ./src/control/config/bins.yaml:/ros2_ws/install/control/share/control/config/bins.yaml:ro

  # mock 모드 web (B2~B3). 브리지 네트워크에서 planner/db를 서비스 이름으로 부른다.
  web:
    build:
      # 컨텍스트가 저장소 루트인 이유는 src/web/Dockerfile 주석 참조 (sort_msgs를 함께 빌드)
      context: .
      dockerfile: src/web/Dockerfile
    depends_on:
      db:
        condition: service_started
      planner:
        condition: service_healthy
    environment:
      PLANNER_URL: http://planner:8100
      DATABASE_URL: postgresql://${POSTGRES_USER:-piece_picking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-piece_picking}
      MOCK_MODE: ${MOCK_MODE:-1}
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"

  # ROS2 모드 web (B4~). 같은 이미지를 MOCK_MODE=0으로 띄운 것이며, 코드 차이는 없다.
  #
  # 별도 서비스로 둔 이유는 **네트워크 모드가 다르기 때문**이다. DDS 디스커버리는
  # 멀티캐스트에 기대므로 브리지 네트워크에서 호스트의 control 노드를 찾지 못한다.
  # control도 이미 network_mode: host다 — 같은 이유다. host 네트워크에서는 서비스 이름
  # DNS가 없으므로 planner/db를 게시된 포트로 부른다.
  #
  # 기동: docker compose --profile ros up web_ros   (mock web과 8000 포트가 겹치므로
  # 둘을 동시에 띄우지 않는다. 그래서 profile로 기본 기동에서 빼 두었다.)
  web_ros:
    profiles: ["ros"]
    build:
      context: .
      dockerfile: src/web/Dockerfile
    network_mode: host
    depends_on:
      db:
        condition: service_started
      planner:
        condition: service_healthy
    environment:
      PLANNER_URL: http://localhost:8100
      DATABASE_URL: postgresql://${POSTGRES_USER:-piece_picking}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB:-piece_picking}
      MOCK_MODE: "0"
      # 호스트의 control/perception 노드와 같은 도메인이어야 서로 보인다
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # RMW는 시스템 전체가 같아야 한다 (src/web/Dockerfile 주석). 호스트 노드도 CycloneDDS다.
      CYCLONEDDS_URI: file:///cyclonedds/cyclonedds.xml
    volumes:
      - ./data:/data:ro
      # 호스트의 CycloneDDS 설정을 그대로 쓴다. 이 워크스테이션은 Cyclone을 lo 인터페이스로
      # 고정해 두었는데, 설정 없이 뜬 컨테이너는 다른 인터페이스를 골라 **디스커버리는 되지만
      # 데이터가 흐르지 않는다**. host 네트워크라 lo가 호스트와 같은 것이므로 설정만 맞추면 된다.
      # 이미지에 굽지 않는 이유: 어느 인터페이스를 쓸지는 배포 환경의 정책이지 앱의 성질이 아니다.
      - ${CYCLONEDDS_CONFIG_DIR:-${HOME}/.config/cyclonedds}:/cyclonedds:ro

volumes:
  pgdata:
